name: backend

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_almacen
          POSTGRES_USER: erp_almacen
          POSTGRES_PASSWORD: erp_almacen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_almacen -d erp_almacen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_DB: erp_almacen
      POSTGRES_USER: erp_almacen
      POSTGRES_PASSWORD: erp_almacen
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --settings=config.settings.dev
      - run: ruff check .
      - run: pytest
