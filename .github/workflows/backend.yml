name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Backend CI (Lint, Migrations & Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_almacen
          POSTGRES_USER: erp_almacen
          POSTGRES_PASSWORD: erp_almacen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_almacen -d erp_almacen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_DB: erp_almacen
      POSTGRES_USER: erp_almacen
      POSTGRES_PASSWORD: erp_almacen
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Verify no missing migrations (DevOps Quality Gate)
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.dev

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.dev

      - name: Run unit and integration tests
        run: pytest
